<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=1648, height=1236, initial-scale=1.0"
    />
    <title>Dashboard RATP E-Ink</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ----------------------------------------------------
       RÉGLAGES GLOBAUX (Verrouillage 1648x1236)
       ---------------------------------------------------- */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1648px;
        height: 1236px;
        overflow: hidden;
        background-color: #ffffff;
        color: #000000;
        font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
        font-optical-sizing: auto;
        font-style: normal;
        -webkit-font-smoothing: none; /* Désactive l'anti-aliasing pour un meilleur rendu E-Ink */
      }

      .screen-container {
        width: 100%;
        height: 100%;
        padding: 50px 60px;
        display: flex;
        flex-direction: column;
      }

      /* ----------------------------------------------------
       PIED DE PAGE : Heure et Batterie
       ---------------------------------------------------- */
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 0 30px 0;
        font-size: 50px;
        font-weight: normal;
        position: absolute;
        bottom: 0;
        left: 10;
        width: 92%;
        background: #fff;
      }

      .footer-status {
        font-size: 45px;
      }

      .footer-status img {
        width: 50px;
        height: 50px;
        display: inline-block;
        vertical-align: middle;
        margin-right: 10px;
      }

      .footer-battery {
        font-size: 45px;
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .battery-icon {
        width: 100px;
        height: 50px;
        border: 6px solid #000000;
        border-radius: 8px;
        position: relative;
        padding: 4px;
      }

      .battery-icon::after {
        content: "";
        position: absolute;
        right: -14px;
        top: 10px;
        width: 8px;
        height: 18px;
        background-color: #000000;
        border-radius: 0 4px 4px 0;
      }
      .battery-level {
        height: 100%;
        width: 65%; /* Niveau de batterie statique (ex: 65%) */
        background-color: #000000;
      }

      /* ----------------------------------------------------
       SECTION 1 : Prochains Métros (2 Lignes)
       ---------------------------------------------------- */
      .metros-section {
        display: flex;
        flex-direction: column;
        gap: 70px;
      }

      .metro-title {
        font-size: 70px;
        font-weight: bold;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .metro-title img {
        width: 70px;
        height: 70px;
        display: inline-block;
        vertical-align: -5%;
      }

      .metro-direction {
        font-size: 50px;
        font-weight: normal;
      }

      .metro-content {
        border: 8px solid #000000;
        border-top-left-radius: 18px;
        border-top-right-radius: 18px;
        padding: 10px 40px;
        display: flex;
        justify-content: space-evenly;
      }

      .metro-time {
        font-size: 180px;
        font-weight: 900;
        letter-spacing: -3px;
      }

      .metro-time span {
        font-size: 60px;
        font-weight: bold;
      }

      .metro-message {
        font-size: 45px;
        font-weight: normal;
        padding: 15px 30px 20px 30px;
        border-bottom-left-radius: 18px;
        border-bottom-right-radius: 18px;
        background: #000000;
        color: #ffffff;
      }

      /* ----------------------------------------------------
       SECTION 2 : Perturbations (3 Lignes)
       ---------------------------------------------------- */
      .alerts-section {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
      }

      .alerts-title {
        font-size: 55px;
        font-weight: 900;
        text-transform: uppercase;
        margin-bottom: 30px;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .alerts-title::before {
        content: "⚠";
        font-size: 65px;
      }

      .alert-list {
        display: flex;
        flex-direction: column;
        gap: 25px;
        flex-grow: 1;
      }

      .alert-item {
        border-left: 20px solid #000000;
        border-top: 4px solid #000000;
        border-right: 4px solid #000000;
        border-bottom: 4px solid #000000;
        padding: 35px 40px;
        display: flex;
        align-items: center;
        gap: 30px;
      }

      .alert-badge {
        font-size: 55px;
        font-weight: 900;
        border: 6px solid #000000;
        border-radius: 50%;
        min-width: 90px;
        height: 90px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .alert-text {
        font-size: 48px;
        font-weight: bold;
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div class="screen-container">
      <!-- PROCHAINS PASSAGES -->
      <section class="metros-section">
        <!-- Métro 12 -->
        <div class="metro-card">
          <div class="metro-title">
            <div>
              Metro <img src="https://ratp.psd.tf/12.jpg" alt="Metro 12" class="metro-badge" />
            </div>
            <div class="metro-direction">vers Mairie d'Aubervilliers</div>
          </div>
          <div class="metro-content">
            <div class="metro-time">3 <span>min</span></div>
            <div class="metro-time">7 <span>min</span></div>
          </div>
          <div class="metro-message">
            Tout roule sur votre ligne ! Ceci est sur deux lignes. Comment
            va-t-on faire ? Oulah c'est très relou ça ! Pouet pouet pouet.
          </div>
        </div>

        <!-- Tram T3a -->
        <div class="metro-card">
          <div class="metro-title">
            <div>
              Tram <img src="https://ratp.psd.tf/t3a.jpg" alt="Tram T3a" class="metro-badge" />
            </div>
            <div class="metro-direction">vers Porte de Vincennes</div>
          </div>
          <div class="metro-content">
            <div class="metro-time">3 <span>min</span></div>
            <div class="metro-time">13 <span>min</span></div>
          </div>
          <div class="metro-message"></div>
        </div>
      </section>

      <footer class="footer">
        <div class="footer-status">
          <img src="https://ratp.psd.tf/realtime.jpg" alt="Temps réel" />
          Temps réel
        </div>
        <div class="footer-battery">
          65%
          <div class="battery-icon">
            <div class="battery-level"></div>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
